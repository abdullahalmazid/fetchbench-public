<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 240px; margin: 0; padding: 14px; background: #000; color: #f2f2f4; font: 13px "Segoe UI", sans-serif; }
    h3 { margin: 0 0 4px; font-size: 14px; display: flex; align-items: center; gap: 8px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #ff6b2b; }
    #status { font-size: 12px; color: #8a8d97; margin-bottom: 12px; }
    #status.ok { color: #10b981; }
    #status.off { color: #ef4444; }
    label { display: flex; align-items: center; gap: 8px; margin: 8px 0; cursor: pointer; }
    input { accent-color: #ff6b2b; }
  </style>
</head>
<body>
  <h3><span class="dot"></span>Fetchbench</h3>
  <div id="status">Checking…</div>
  <label><input type="checkbox" id="capture"> Take over browser downloads</label>
  <label><input type="checkbox" id="sniff"> Show button on videos</label>
  <script src="popup.js"></script>
</body>
</html>
